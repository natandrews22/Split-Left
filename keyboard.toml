[keyboard]
name = "RMK_SGD_Keypad"
product_name = "RMK_SGD_Keypad"
vendor_id = 0x4C4B
product_id = 0x4643
manufacturer = "Nathan"
chip = "nrf52840"

[host]
# Whether Vial is enabled (default: true)
vial_enabled = true
# The unlock keys are the combo of the row 0, col 0 key and
# the row 0, col 1 key
unlock_keys = [[0, 0], [1, 1]]

[ble]
enabled = true

# nice!nano v2 battery monitoring
battery_adc_pin = "vddh"

# nice!nano voltage divider values
adc_divider_measured = 2000
adc_divider_total = 2806

default_tx_power = 0

[matrix]
row_pins = ["P0_17","P0_20","P0_22","P1_00","P0_11","P1_04"]
col_pins = ["P0_09","P0_10","P0_29","P0_31","P1_01","P1_02","P1_07"]

# Uncomment if your diodes point from row to column
# row2col = true

[layout]
rows = 6
cols = 7
layers = 2

keymap = [
    [
        ["Esc", "F1", "F2", "F3", "F4", "F5", "F6"],
        ["Tab", "A", "W", "E", "R", "T", "Y"],
        ["CapsLock", "A", "S", "D", "F", "G", "H"],
        ["LShift", "Z", "X", "C", "V", "B", "N"],
        ["LCtrl", "LGui", "LAlt", "Space", "RAlt", "Menu", "RCtrl"],
        ["_", "_", "_", "_", "_", "_", "_"]
    ],
    [
        ["Esc", "F1", "F2", "F3", "F4", "F5", "F6"],
        ["Tab", "Q", "W", "E", "R", "T", "Y"],
        ["CapsLock", "A", "S", "D", "F", "G", "H"],
        ["LShift", "Z", "X", "C", "V", "B", "N"],
        ["LCtrl", "LGui", "LAlt", "Space", "RAlt", "Menu", "RCtrl"],
        ["_", "_", "_", "_", "_", "_", "_"]
    ]
]
